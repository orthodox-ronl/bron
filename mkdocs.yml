site_name: bron — documentatie
site_description: Documentatie van de centrale bronrepository voor orthodoxe kerkmuziek (VSA)
site_url: https://orthodox-groningen.github.io/bron/
repo_url: https://github.com/orthodox-groningen/bron
repo_name: orthodox-groningen/bron
edit_uri: edit/main/docs/

exclude_docs: |
  overrides/**

not_in_nav: |
  terms/**

theme:
  name: material
  language: nl
  custom_dir: docs/overrides
  favicon: images/favicon.ico
  logo: images/favicon-32x32.png
  font:
    text: Source Sans 3
    code: Source Code Pro
  palette:
    - scheme: default
      primary: custom
      accent: custom
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.action.edit

plugins:
  - search
  - git-revision-date-localized:
      type: date
      locale: nl
      timezone: Europe/Amsterdam
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Starten:
    - Overzicht: getting-started/index.md
  - Terminologie:
    - Overzicht: glossary.md
  - Specificaties:
    - Overzicht: specs/index.md
    - specs/documentatie-eigendom.md
    - specs/terminologie.md
    - specs/zangstuk-identificatie.md
    - specs/schrijfconventies.md
    - specs/inhoudslevenscyclus.md
    - specs/repo-structuur.md
    - specs/zangstuk-formaat.md
    - specs/catalogus-architectuur.md
    - specs/catalogus-zoek-api.md
    - specs/catalogus-samenstelling-zangstuk.md
  - Handleidingen:
    - Overzicht: manuals/index.md
    - manuals/github-pages-setup.md
    - manuals/zangstuk-toevoegen.md
    - manuals/bronvariant-toevoegen.md
    - manuals/copyright-access.md
    - manuals/parochie-lokaal-zangstukken.md
    - Catalogus:
      - Overzicht: manuals/catalogus/index.md
      - manuals/catalogus/sjabloon-schrijven.md
      - manuals/catalogus/rene-liturgie-geboorte-moeder-gods.md
      - manuals/catalogus/rene-cherubijnenhymne-lokaal.md
      - manuals/catalogus/rene-cherubijnenhymne-naar-bron.md
      - manuals/catalogus/rene-cherubijnenhymne-musicxml.md
  - Referentie:
    - Overzicht: reference/index.md
    - reference/conversiemechanismen.md
    - reference/conversie-vsa-svg.md
    - reference/conversie-vsa-musicxml.md
    - reference/exportcontracten.md
    - reference/exporttype-svg.md
    - reference/exporttype-coria.md
    - reference/exporttype-mxl.md
    - reference/brontypes-validatie.md
    - reference/catalogus-cli.md
  - Plannen:
    - Overzicht: plans/README.md
    - Ideeën:
      - Overzicht: plans/ideeen/README.md
      - plans/ideeen/alias-blokken.md
      - plans/ideeen/tev2-terminologie.md
    - plans/tev2-h4-eenvoudige-termrefs.md
    - plans/ci-architectuur.md
    - plans/alias-blokken-ontwerp.md
    - plans/migratie-zondag-zangstukken.md
    - plans/audit-zangstuk-catalogus.md
    - plans/gebruikseisen-representatievormen.md
    - plans/samenvatting-project.md

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  preview: false
  build_time: "2026-08-06 19:32 CEST"
  branch: "local"
  social:
    - icon: fontawesome/solid/book-bible
      link: https://orthodox-groningen.github.io/bron/
      name: bron — documentatie
    - icon: fontawesome/solid/code
      link: https://orthodox-groningen.github.io/VSA-tooling/
      name: VSA-tooling — documentatie
    - icon: fontawesome/solid/globe
      link: https://orthodox-groningen.github.io/VSA-demo/
      name: VSA-demo

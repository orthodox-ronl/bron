site_name: bron — documentatie
site_description: Documentatie van de centrale bronrepository voor orthodoxe kerkmuziek (VSA)
site_url: https://orthodox-groningen.github.io/bron/
repo_url: https://github.com/orthodox-groningen/bron
repo_name: orthodox-groningen/bron
edit_uri: edit/main/docs/

exclude_docs: |
  overrides/**

theme:
  name: material
  language: nl
  custom_dir: docs/overrides
  favicon: images/favicon.ico
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.action.edit

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Specificaties:
    - specs/index.md
    - specs/documentatie-eigendom.md
    - specs/terminologie.md
    - glossary.md
    - Termen:
      - terms/zangstuk.md
      - terms/variant.md
      - terms/uitvoeringsvorm.md
      - terms/representatie.md
    - specs/zangstuk-identificatie.md
    - specs/schrijfconventies.md
    - specs/inhoudslevenscyclus.md
    - specs/repo-structuur.md
    - specs/zangstuk-formaat.md
    - specs/catalogus-architectuur.md
    - specs/catalogus-zoek-api.md
    - specs/catalogus-samenstelling-zangstuk.md
  - Handleidingen:
    - manuals/index.md
    - manuals/github-pages-setup.md
    - manuals/zangstuk-toevoegen.md
    - manuals/bronvariant-toevoegen.md
    - manuals/copyright-access.md
    - manuals/parochie-lokaal-zangstukken.md
    - Catalogus:
      - manuals/catalogus/index.md
      - manuals/catalogus/sjabloon-schrijven.md
      - manuals/catalogus/rene-liturgie-geboorte-moeder-gods.md
      - manuals/catalogus/rene-cherubijnenhymne-lokaal.md
      - manuals/catalogus/rene-cherubijnenhymne-naar-bron.md
      - manuals/catalogus/rene-cherubijnenhymne-musicxml.md
  - Referentie:
    - reference/index.md
    - reference/conversiemechanismen.md
    - reference/conversie-vsa-svg.md
    - reference/conversie-vsa-musicxml.md
    - reference/exportcontracten.md
    - reference/exporttype-svg.md
    - reference/exporttype-coria.md
    - reference/exporttype-mxl.md
    - reference/brontypes-validatie.md
    - reference/catalogus-cli.md
  - Plannen:
    - plans/README.md
    - Ideeën:
      - plans/ideeen/README.md
      - plans/ideeen/alias-blokken.md
      - plans/ideeen/tev2-terminologie.md
    - plans/ci-architectuur.md
    - plans/alias-blokken-ontwerp.md
    - plans/migratie-zondag-zangstukken.md
    - plans/samenvatting-project.md

extra_css:
  - stylesheets/extra.css

extra:
  preview: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/orthodox-groningen/bron
      name: bron op GitHub
    - icon: fontawesome/solid/code
      link: https://orthodox-groningen.github.io/VSA-tooling/
      name: VSA-tooling demosite

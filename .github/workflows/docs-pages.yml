name: Deploy documentation

on:
  push:

permissions:
  contents: write

jobs:
  build:
    name: Build MkDocs site
    runs-on: ubuntu-latest

    outputs:
      destination_dir: ${{ steps.target.outputs.destination_dir }}
      url_prefix: ${{ steps.target.outputs.url_prefix }}
      pages_url: ${{ steps.target.outputs.pages_url }}
      label: ${{ steps.target.outputs.label }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine deploy target
        id: target
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "site_url=https://orthodox-groningen.github.io/bron/" >> "$GITHUB_OUTPUT"
            echo "destination_dir=" >> "$GITHUB_OUTPUT"
            echo "url_prefix=/bron/" >> "$GITHUB_OUTPUT"
            echo "pages_url=https://orthodox-groningen.github.io/bron/" >> "$GITHUB_OUTPUT"
            echo "preview=false" >> "$GITHUB_OUTPUT"
            echo "label=production" >> "$GITHUB_OUTPUT"
          else
            echo "site_url=https://orthodox-groningen.github.io/bron/preview/" >> "$GITHUB_OUTPUT"
            echo "destination_dir=preview" >> "$GITHUB_OUTPUT"
            echo "url_prefix=/bron/preview/" >> "$GITHUB_OUTPUT"
            echo "pages_url=https://orthodox-groningen.github.io/bron/preview/" >> "$GITHUB_OUTPUT"
            echo "preview=true" >> "$GITHUB_OUTPUT"
            echo "label=preview" >> "$GITHUB_OUTPUT"
          fi

      - name: Show deploy target
        run: |
          echo "Target: ${{ steps.target.outputs.label }}"
          echo "site_url: ${{ steps.target.outputs.site_url }}"
          echo "destination_dir: ${{ steps.target.outputs.destination_dir }}"
          echo "url_prefix: ${{ steps.target.outputs.url_prefix }}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docs.txt

      - name: Install terminology tools
        run: npm install -g @tno-terminology-design/trrt @tno-terminology-design/hrgt @tno-terminology-design/mrgt @tno-terminology-design/mrg-import

      - name: Configure MkDocs site URL
        run: |
          python scripts/set-mkdocs-site-url.py \
            "${{ steps.target.outputs.site_url }}" \
            "${{ steps.target.outputs.preview }}"

      - name: Prepare TEV2 docs staging tree
        run: python scripts/prepare-tev2-docs.py

      - name: Run terminology tools
        run: |
          cd generated/docs
          mrg-import -c tev2-config.yaml
          mrgt       -c tev2-config.yaml
          hrgt -f    -c tev2-config.yaml
          trrt -f    -c tev2-config.yaml

      - name: Publish generated machine-readable glossaries
        run: |
          mkdir -p docs/mrgs
          cp generated/docs/mrgs/mrg.bron*.yaml docs/mrgs/

      - name: Commit generated machine-readable glossaries
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update TEV2 machine-readable glossaries
          file_pattern: docs/mrgs/mrg.bron*.yaml

      - name: Build MkDocs site
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: python -m mkdocs build --strict -f generated/mkdocs.yml --site-dir ../site

      - name: Upload documentation site
        uses: actions/upload-artifact@v4
        with:
          name: pages-docs-site
          path: site
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    uses: orthodox-groningen/VSA-tooling/.github/workflows/pages-deploy-reusable.yml@main
    with:
      artifact_name: pages-docs-site
      publish_dir: site
      destination_dir: ${{ needs.build.outputs.destination_dir }}
      url_prefix: ${{ needs.build.outputs.url_prefix }}
      pages_url: ${{ needs.build.outputs.pages_url }}
    permissions:
      contents: write

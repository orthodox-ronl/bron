name: Validate catalogus

on:
  push:
  pull_request:

jobs:
  test:
    name: Catalogus tests and index validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout bron repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install catalogus
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest

      - name: Validate alias-blokken register
        run: python -m catalogus.cli aliases validate --bron-root .

      - name: Check alias-blok sync drift
        run: python -m catalogus.cli aliases sync --check --bron-root .

      - name: Validate bron alias-index
        run: python -m catalogus.cli index validate --bron-root .

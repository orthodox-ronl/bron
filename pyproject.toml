[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catalogus"
version = "0.1.0"
description = "Zangstuk-catalogus: alias-index en resolver voor orthodox-groningen"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
catalogus = "catalogus.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

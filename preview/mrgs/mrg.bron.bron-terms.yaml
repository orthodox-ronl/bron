      - "varianten"
    glossaryTerm: "Variant"
    glossaryText: "Een inhoudelijk andere muzikale variant onder hetzelfde zangstuk, met dezelfde liturgische functie maar wezenlijk andere muzikale inhoud."
    scopetag: "bron"
    locator: "variant.md"
    navurl: "https://orthodox-groningen.github.io/bron/terms/variant"
    headingids:

      - "uitvoeringsvorm"
      - "uitvoeringsvormen"
    glossaryTerm: "Uitvoeringsvorm"
    glossaryText: "Een beschrijving van wat je hoort bij correcte uitvoering van een variant, vanuit een representatie of mondelinge overlevering."
    scopetag: "bron"
    locator: "uitvoeringsvorm.md"
    navurl: "https://orthodox-groningen.github.io/bron/terms/uitvoeringsvorm"

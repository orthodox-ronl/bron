# TNO Terminology Engine v2 configuration for the bron documentation.

scopedir: .
onNotExist: warn
output: .

mrgt:
  vsntag:

hrgt:
  converter[1]: "| [{{#if glossaryTerm}}{{noRefs glossaryTerm}}{{else}}{{capFirst term}}{{/if}}](terms/{{term}}.md) | {{#if glossaryText}}{{noRefs glossaryText}}{{else}}Geen `glossaryText` opgegeven voor deze term.{{/if}} |\n"
  converter[2]: "{{#if glossaryAbbr}}| [{{glossaryAbbr}}](terms/{{term}}.md) | Afkorting van [{{#if glossaryTerm}}{{noRefs glossaryTerm}}{{else}}{{capFirst term}}{{/if}}](terms/{{term}}.md). |\n{{else}}{{log level='silent'}}{{/if}}"
  input:
    - "*.md"

trrt:
  converter: html-hovertext-link
  input:
    - "**/*.md"

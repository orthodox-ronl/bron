  vsntag: "bron-terms"
scopes: []
entries:
  - term: "afgeleide"
    formPhrases:
      - "afgeleide"
      - "afgeleiden"
      - "afgeleide-n"
    glossaryTerm: "Afgeleide"
    glossaryText: "Een bestand dat volledig en herhaalbaar door een [conversiemechanisme](@) uit een [bronbestand](@) wordt gegenereerd, en dat (dus) niet als [bronbestand](@) in de [bron-repository](@) staat."
    glossaryNotes:
      - "Voorbeelden: `.svg` via `vsa svg`; `.mxl` via `vsa musicxml`."
      - "[Afgeleiden](@) worden niet getrackt in de [bron-repository](@); ze worden gegenereerd tijdens de build."
    scopetag: "bron"
    locator: "afgeleide.md"
    navurl: "https://orthodox-groningen.github.io/bron/terms/afgeleide"
    headingids:
      - "afgeleide"
      - "motivatie"
    termType: "concept"
    termid: "concept:afgeleide"
    vsntag: "bron-terms"
  - term: "bron-repository"
    formPhrases:
      - "bron-repository"
      - "bron-repository-s"
      - "bron-repositories"
      - "bron-repo"
      - "bron-repos"
      - "bron-repo-s"
    glossaryTerm: "Bron-repository"
    glossaryAlias: "Bron-repo"
    glossaryText: "De git-repository `orthodox-groningen/bron` (of een expliciet aangewezen opvolger); de centrale opslagplaats voor [representaties](@) van [uitvoeringsvormen](@) (van [varianten](@)) van [zangstukken](@), alsmede voor de specificaties van de opslag, en van manieren om daarin te zoeken."
    glossaryNotes:
      - "Niet verwarren met [bronbestand](@) (een bestand) of [herkomst](@) (metadata over oorsprong)."
      - "Repositories voor de [VSA-tooling](https://github.com/orthodox-groningen/VSA-tooling/), of parochie-specifieke zaken en vendor-checkouts zijn geen bron-repository."
    scopetag: "bron"
    locator: "bron-repository.md"
    navurl: "https://orthodox-groningen.github.io/bron/terms/bron-repository"
    headingids:
      - "bron-repository"
      - "motivatie"
    termType: "concept"
    termid: "concept:bron-repository"
    vsntag: "bron-terms"
  - term: "bronbestand"
    formPhrases:
      - "bronbestand"
      - "bronbestanden"
    glossaryTerm: "Bronbestand"
    glossaryText: "Een bestand waarvoor geen geautomatiseerd, herhaalbaar [conversiemechanisme](@) bestaat dat het volledig uit een ander getrackt bestand in dezelfde repository genereert."
    glossaryNotes:
      - "Voor het opnemen van bronbestanden in de [bron-repo](@) is dus altijd tenminste één handmatige actie vereist."
      - heading: "Voorbeelden van bronbestanden:"
        items:
          - "handmatig geschreven `.vsa` bestanden."
          - "gescande documenten (met extensies als `.tif`, `.jpg`, `.pdf` e.d.)"
          - "MusicXML of MXL bestanden die door een programma als MuseScore zijn gemaakt"
          - "Een `.coria.html` bestand zoals je die door `https://coria.nl/` kunt laten maken (en dan in de repo zetten)"
      - heading: "Voorbeelden van [afgeleiden](@) (dat zijn per definitie GEEN bronbestanden):"
        items:
          - "`.svg` bestanden die middels de [vsa tool](@) zijn gegenereerd."
          - "HTML bestanden zoals die zijn gegenereerd uit geautomatiseerde workflows."
    scopetag: "bron"
    locator: "bronbestand.md"
    navurl: "https://orthodox-groningen.github.io/bron/terms/bronbestand"
    headingids:
      - "bronbestand"
      - "motivatie"
    termType: "concept"
    termid: "concept:bronbestand"
    vsntag: "bron-terms"
  - term: "compositie"
    formPhrases:
      - "compositie"
      - "composities"
    glossaryTerm: "Compositie"
    glossaryText: "Een YAML-bestand onder `composities/` in de [bron-repository](@) met geordende verwijzingen naar [zangstukken](@) (toekomstig: via `zangstuk-id`, `variant-id`, `uitvoeringsvorm-id`). Nog niet geïmplementeerd."
    glossaryNotes:
      - "Nog niet geïmplementeerd in de [bron-repository](@)."
      - "Niet verwarren met [samenstelling](@) (parochie-markdown met `:::include`) of sjabloon (markdown met `:::include zoek=`)."
    scopetag: "bron"
    locator: "compositie.md"
    navurl: "https://orthodox-groningen.github.io/bron/terms/compositie"
    headingids:
      - "compositie"
      - "motivatie"
    termType: "concept"
    termid: "concept:compositie"
    vsntag: "bron-terms"
  - term: "conversiemechanisme"
    formPhrases:
      - "conversiemechanisme"
      - "conversiemechanismen"
    glossaryTerm: "Conversiemechanisme"
    glossaryText: "Een gedefinieerde, geautomatiseerde en herhaalbare tool CM die een [bronbestand](@) B omzet naar een [afgeleide](@) AB = CM(B)."
    glossaryNotes:
      - "Voorbeelden: `vsa svg` (VSA → SVG), `vsa musicxml` (VSA → MXL)."
      - "Het bestaan van een conversiemechanisme is het criterium waarmee onderscheid wordt gemaakt tussen [bronbestand](@) en [afgeleide](@)."
    scopetag: "bron"
    locator: "conversiemechanisme.md"
    navurl: "https://orthodox-groningen.github.io/bron/terms/conversiemechanisme"
    headingids:
      - "conversiemechanisme"
      - "motivatie"
    termType: "concept"
    termid: "concept:conversiemechanisme"
    vsntag: "bron-terms"
  - term: "exportmechanisme"
    formPhrases:
      - "exportmechanisme"
      - "exportmechanismen"
    glossaryTerm: "Exportmechanisme"
    glossaryText: "De manier waarop een [samenstelling](@) een [bronbestand](@) of [afgeleide](@) ontsluit voor een lezersdoel, via een `:::include`-directive met een [exporttype](@)."
    scopetag: "bron"
    locator: "exportmechanisme.md"
    navurl: "https://orthodox-groningen.github.io/bron/terms/exportmechanisme"
    headingids:
      - "exportmechanisme"
      - "motivatie"
    termType: "concept"
    termid: "concept:exportmechanisme"
    vsntag: "bron-terms"
  - term: "exporttype"
    formPhrases:
      - "exporttype"
      - "exporttypen"
      - "exporttypes"
    glossaryTerm: "Exporttype"
    glossaryText: "De naam die in een `:::include <exporttype>`-directive aangeeft welk [exportmechanisme](@) wordt gebruikt, zoals `svg`, `coria` of `mxl`."
    glossaryNotes:
      - "Huidige exporttypen: `svg`, `coria`, `mxl`."
    scopetag: "bron"
    locator: "exporttype.md"
    navurl: "https://orthodox-groningen.github.io/bron/terms/exporttype"
    headingids:
      - "exporttype"
      - "motivatie"
    termType: "concept"
    termid: "concept:exporttype"
    vsntag: "bron-terms"
  - term: "geregistreerde-representatie"
    formPhrases:
      - "geregistreerde-representatie"
      - "geregistreerde-representaties"
      - "geregistreerd"
    glossaryTerm: "Geregistreerde representatie"
    glossaryText: "Een [representatie](@) waarvoor een [source-entry](@) bestaat in de [bron-repository](@) die haar koppelt via `file:`, `access:` of `status:`."
    glossaryNotes:
      - "Het tegenovergestelde van een [parochie-lokale representatie](@)."
      - "Registratie vindt plaats via [promotie](@): een PR naar de [bron-repository](@) met [source-entry](@) en [bronbestand](@)."
    scopetag: "bron"
    locator: "geregistreerde-representatie.md"
    navurl: "https://orthodox-groningen.github.io/bron/terms/geregistreerde-representatie"
    headingids:
      - "geregistreerde-representatie"
      - "motivatie"
    termType: "concept"
    termid: "concept:geregistreerde-representatie"
    vsntag: "bron-terms"
  - term: "herkomst"
    formPhrases:
      - "herkomst"
    glossaryTerm: "Herkomst"
    glossaryText: "Metadata die beschrijft *waar* een [zangstuk](@), [variant](@), [uitvoeringsvorm](@) of [representatie](@) vandaan komt — mens, traditie, publicatie of parochie — maar niet zijnde een [bronbestand](@) of de [bron-repository](@) zelf."
    glossaryNotes:
      - "Herkomst mag onbekend zijn: de entiteit bestaat desondanks."
      - "Herkomst is geen bestand; het is metadata (zoals `reference:` in `zangstuk.yaml`)."
    scopetag: "bron"
    locator: "herkomst.md"
    navurl: "https://orthodox-groningen.github.io/bron/terms/herkomst"
    headingids:
      - "herkomst"
      - "motivatie"
    termType: "concept"
    termid: "concept:herkomst"
    vsntag: "bron-terms"
  - term: "manifest"
    formPhrases:
      - "manifest"
      - "manifesten"
    glossaryTerm: "Manifest"
    glossaryText: "Een YAML-bestand met vaste bestandsnaam (`variant.yaml` of `uitvoeringsvorm.yaml`) dat precies één entiteit op [variant](@)- of [uitvoeringsvorm](@)-niveau registreert en uitsluitend metadata over die entiteit beschrijft."
    glossaryNotes:
      - "Niet verwarren met npm-package-manifest, PWA-manifest, CI-build-manifest of andere generieke gebruiken van het woord *manifest*."
      - "`zangstuk.yaml` in de [bron-repository](@) is geen manifest — dat volgt het [source-entry](@)-model."
      - "Een manifest is zelf geen [representatie](@), [bronbestand](@) of [samenstelling](@)."
    scopetag: "bron"
    locator: "manifest.md"
    navurl: "https://orthodox-groningen.github.io/bron/terms/manifest"
    headingids:
      - "manifest"
      - "motivatie"
    termType: "concept"
    termid: "concept:manifest"
    vsntag: "bron-terms"
  - term: "parochie-lokale-representatie"
    formPhrases:
      - "parochie-lokale-representatie"
      - "parochie-lokale-representaties"
      - "parochie-lokaal"
    glossaryTerm: "Parochie-lokale representatie"
    glossaryText: "Een [bronbestand](@) of inline-notatie in een parochie-repo die nog niet [geregistreerd](@) is in de [bron-repository](@)."
    glossaryNotes:
      - "Na [promotie](@) (PR naar [bron-repository](@)) wordt een parochie-lokale representatie een [geregistreerde representatie](@)."
      - "Parochie-lokale representaties staan onder `content-source/lokaal/<zangstuk-id>/<variant-id>/…`."
    scopetag: "bron"
    locator: "parochie-lokale-representatie.md"
    navurl: "https://orthodox-groningen.github.io/bron/terms/parochie-lokale-representatie"
    headingids:
      - "parochie-lokale-representatie"
      - "motivatie"
    termType: "concept"
    termid: "concept:parochie-lokale-representatie"
    vsntag: "bron-terms"
  - term: "promotie"
    formPhrases:
      - "promotie"
      - "registratie"
    glossaryTerm: "Promotie (registratie)"
    glossaryText: "De overgang van een [parochie-lokale representatie](@) naar een [geregistreerde representatie](@), door het toevoegen van een [source-entry](@) en bijbehorend [bronbestand](@) in de [bron-repository](@) via een PR."
    glossaryNotes:
      - "Bij promotie blijven de canonieke ids behouden."
      - "Promotie vereist een PR op de [bron-repository](@) met [source-entry](@) én [bronbestand](@)."
    scopetag: "bron"
    locator: "promotie.md"
    navurl: "https://orthodox-groningen.github.io/bron/terms/promotie"
    headingids:
      - "promotie"
      - "motivatie"
    termType: "concept"
    termid: "concept:promotie"
    vsntag: "bron-terms"
  - term: "representatie"
    formPhrases:
      - "representatie"
      - "representaties"
    glossaryTerm: "Representatie"
    glossaryText: "Een bestand waarin een uitvoeringsvorm concreet is vastgelegd."
    glossaryNotes:
      - "Er zijn verschillende *vormen* waarin dit kan worden vastgelegd, zoals [VSA](@), MusicXML of MXL, audio, een scan van een partituur, enz."
      - "Er zijn verschillende *bestandsformaten* (extensies) die daarbij kunnen worden gebruikt, zoals `.vsa`, `.MusicXML`, `.MXL`, `.mp3`, `.pdf`, `.svg`, `.jpg`, etc."
      - "Om een representatie van een [uitvoeringsvorm](@) te onderscheiden kun je de vraag stellen of het een bestand betref of niet."
    scopetag: "bron"
    locator: "representatie.md"
    navurl: "https://orthodox-groningen.github.io/bron/terms/representatie"
    headingids:
      - "representatie"
      - "motivatie"
    termType: "concept"
    termid: "concept:representatie"
    vsntag: "bron-terms"
  - term: "samenstelling"
    formPhrases:
      - "samenstelling"
      - "samenstellingen"
    glossaryTerm: "Samenstelling"
    glossaryText: "Een markdown-document (met VSA-directives) dat [representaties](@) ordent voor een lezersdoel, zonder zelf [representatie](@) te zijn."
    glossaryNotes:
      - "Voorbeelden: `zondag-toon-1.md`, `antifonen-hemelum.md`."
      - "Een samenstelling is het ingevulde (opgeloste) resultaat van een sjabloon."
      - "Niet verwarren met [compositie](@) (org-brede ordered list van [zangstukken](@) in yaml) of sjabloon (markdown met `:::include zoek=`)."
    scopetag: "bron"
    locator: "samenstelling.md"
    navurl: "https://orthodox-groningen.github.io/bron/terms/samenstelling"
    headingids:
      - "samenstelling"
      - "motivatie"
    termType: "concept"
    termid: "concept:samenstelling"
    vsntag: "bron-terms"
  - term: "source-entry"
    formPhrases:
      - "source-entry"
      - "source-entries"
    glossaryTerm: "Source-entry"
    glossaryText: "Een element in de `sources:`-lijst van `zangstuk.yaml` in de [bron-repository](@), met een uniek `id` binnen dat [zangstuk](@); registreert een [representatie](@) of placeholder op het huidige platte model."
    glossaryNotes:
      - "Het `id`-veld van een source-entry correspondeert met het `representatie-id`."
      - "Meerdere [source-entries](@) kunnen meerdere [representaties](@) registreren, of (legacy) nog niet onderscheiden [variant](@)/[uitvoeringsvorm](@)-structuur bevatten — bij nieuw werk gebruik het vier-niveaumodel."
    scopetag: "bron"
    locator: "source-entry.md"
    navurl: "https://orthodox-groningen.github.io/bron/terms/source-entry"
    headingids:
      - "source-entry"
      - "voorbeelden-van-source-entries"
      - "motivatie"
    termType: "concept"
    termid: "concept:source-entry"
    vsntag: "bron-terms"
  - term: "uitvoeringsvorm"
    formPhrases:
      - "uitvoeringsvorm"
      - "uitvoeringsvormen"
    glossaryTerm: "Uitvoeringsvorm"
    glossaryText: "Een concrete realisatie van een bepaalde [variant](@) van een [zangstuk](@), waarbij de muzikale identiteit van die variant behouden blijft."
    glossaryNotes:
      - heading: "Twee uitvoeringsvormen van dezelfde [variant](@) van een [zangstuk](@) kunnen verschillen in:"
        items:
          - "de keuze van instrumenten/zangers die verschillende stemmen vertolken"
          - "de manier waarop bepaalde loopjes (omhoog-omlaag of omgekeerd) worden uitgevoerd"
          - "de verdeling van lettergrepen over de noten"
    scopetag: "bron"
    locator: "uitvoeringsvorm.md"
    navurl: "https://orthodox-groningen.github.io/bron/terms/uitvoeringsvorm"
    headingids:
      - "uitvoeringsvorm"
      - "motivatie"
    termType: "concept"
    termid: "concept:uitvoeringsvorm"
    vsntag: "bron-terms"
  - term: "variant"
    formPhrases:
      - "variant"
      - "varianten"
      - "variant-van-een-zangstuk"
      - "varianten-van-een-zangstuk"
      - "varianten-van-zangstukken"
    glossaryTerm: "Variant (van een Zangstuk)"
    glossaryText: "Een zekere zelfstandige muzikale realisatie van het [zangstuk](@), dat zich van andere varianten van datzelfde [zangstuk](@) onderscheidt door geheel eigen en wezenlijk andere muzikale kenmerken."
    glossaryNotes:
      - "Varianten van het [zangstuk](@) dat we kennen als de Cherubijnenhymne zijn gemaakt door Kastorski, Tchikhinashvili, Rachmaninov en anderen."
      - "Twee varianten van hetzelfde [zangstuk](@) klinken heel anders; als je de tekst niet hoort of zou kennen kun je denken dat het uitvoeringen van verschillende [zangstukken](@) zijn."
      - "Vergelijkbare begrippen die buiten de scope van deze terminologie ook wel worden gehanteerd zijn `bewerking`, `versie`, `setting`, `compositievariant`."
    scopetag: "bron"
    locator: "variant.md"
    navurl: "https://orthodox-groningen.github.io/bron/terms/variant"
    headingids:
      - "variant"
      - "motivatie"
    termType: "concept"
    termid: "concept:variant"
    vsntag: "bron-terms"
  - term: "zangstuk"
    formPhrases:
      - "zangstuk"
      - "zangstukken"
    glossaryTerm: "Zangstuk"
    glossaryText: "Een liturgisch-muzikaal geheel met een stabiele `zangstuk-id`, waaronder nul of meer varianten bestaan."
    scopetag: "bron"
    locator: "zangstuk.md"
    navurl: "https://orthodox-groningen.github.io/bron/terms/zangstuk"
    headingids:
      - "zangstuk"
    termType: "concept"
    termid: "concept:zangstuk"
    vsntag: "bron-terms"

# Org-breed aliassen-register voor liturgische rollen (alias-blokken).
#
# Eén term uit een blok volstaat als annotatie; sync/loader breidt uit naar alle
# leden van het blok. Zie docs/plans/alias-blokken-ontwerp.md.
#
# Formaat: elk alias op een eigen regel (geen inline [a, b, c]).
# Matching is case-insensitive (normalize-for-match / casefold).

blokken:

  ontvangenis van de moeder gods: # 8 december
    aliassen:
      - ontvangenis moeder gods
      - ontvangenis theotokos
      - ontvangenis van de theotokos

  "Geboorte van Christus": # 25 december
    aliassen:
      - "Kerstmis"
      - "Geboorte van de Heer"
      - "Geboorte van Jezus"
      - "Christus Geboorte"

  "Geboorte van de Moeder Gods": # 8 september
    aliassen:
      - "Geboorte van de Theotokos"
      - "Geboorte Moeder Gods"
      - "Geboorte Theotokos"
  
  "Verheffing van het Heilig Kruis": # 14 september
    aliassen:
      - "Kruisverheffing"
  
  "Tempelgang van de Moeder Gods": # 21 november
